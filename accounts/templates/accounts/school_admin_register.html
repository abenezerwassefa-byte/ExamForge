{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Administrator Registration | ExamForge</title>

    <link rel="stylesheet" href="{% static 'accounts/css/school_admin_register.css' %}">
</head>

<body>

    <main>

        <section class="registration-card">

            <header class="registration-header">

                <h1>Register your school</h1>

                <p class="description">
                    Create your School Administrator account to
                    register your institution on ExamForge.
                </p>

            </header>


            <form method="POST" class="registration-form">

                {% csrf_token %}

                <!-- Platform Administrator Authorization -->

                <div class="form-group">
                    <label for="totp_code">
                        Code from your Platform Administrator
                    </label>

                    <input
                        type="text"
                        id="totp_code"
                        name="totp_code"
                        placeholder="Enter the 6-digit code"
                        maxlength="6"
                        pattern="[0-9]{6}"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        required
                    >
                </div>


                <!-- School Information -->

                <div class="form-group">
                    <label for="school_name">School Name</label>

                    <input
                        type="text"
                        id="school_name"
                        name="school_name"
                        placeholder="Enter your school's name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="school_email">School Email Address</label>

                    <input
                        type="email"
                        id="school_email"
                        name="school_email"
                        placeholder="Enter your school's email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="school_phone">School Phone Number</label>

                    <input
                        type="tel"
                        id="school_phone"
                        name="school_phone"
                        placeholder="Enter your school's phone number"
                    >
                </div>


                <div class="form-group">
                    <label for="school_address">School Address</label>

                    <textarea
                        id="school_address"
                        name="school_address"
                        placeholder="Enter your school's address"
                        rows="3"
                    ></textarea>
                </div>


                <!-- Administrator Information -->

                <div class="form-group">
                    <label for="full_name">Administrator's Full Name</label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">Administrator's Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password1">Password</label>

                    <input
                        type="password"
                        id="password1"
                        name="password1"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password2">Confirm Password</label>

                    <input
                        type="password"
                        id="password2"
                        name="password2"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >
                </div>


                <!-- Submit -->

                <button type="submit" class="submit-button">
                    Register School
                </button>

            </form>


            <footer class="registration-footer">

                <p>
                    Already have an account?
                    <a href="{% url 'login' %}">Sign in</a>
                </p>

                <a href="{% url 'register' %}" class="back-link">
                    Back to registration options
                </a>

            </footer>

        </section>

    </main>

</body>

</html>
