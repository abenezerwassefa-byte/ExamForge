{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Administrator Registration | ExamForge</title>

    <link rel="stylesheet" href="{% static 'accounts/css/school_admin_register.css' %}">
</head>

<body>

    <main>

        <section class="registration-card">

            <header class="registration-header">

                <h1>School Administrator Registration</h1>

                <p>
                    Register your school and create your administrator account
                    to get started with ExamForge.
                </p>

            </header>

            <form method="POST" class="registration-form">

                {% csrf_token %}

                {% if error %}
                    <p class="error-message">{{ error }}</p>
                {% endif %}

                <div class="form-group">

                    <label for="school_name">School Name</label>

                    <input
                        type="text"
                        id="school_name"
                        name="school_name"
                        placeholder="Enter your school's name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="full_name">Full Name</label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirm_password">Confirm Password</label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>

                <button type="submit" class="submit-button">
                    Create Administrator Account
                </button>

            </form>

            <footer class="registration-footer">

                <a href="{% url 'register' %}">
                    Back to registration options
                </a>

            </footer>

        </section>

    </main>

</body>

</html>
```
